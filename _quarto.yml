project:
  type: website
  output-dir: docs
  resources:
    - styles.css
    - clases/**/*.pptx
    - clases/**/*.pdf
    - resources/programa/**/*.pdf
    - resources/biblio/**/*.pdf
  render:
    - index.qmd
    - curso.qmd
    - bibliografia.qmd
    - Recursos.qmd
    - ultima-informacion.qmd
    - ultima-informacion/*.qmd

    # CLASES PUBLICADAS (con PDF o PPTX)
    - clases/clase_00/index.qmd
    - clases/clase_01/index.qmd
    - clases/clase_02/index.qmd
    - clases/clase_03/index.qmd
    - clases/clase_04/index.qmd

    # OCULTAS HASTA QUE EXISTA MATERIAL
    # - clases/clase_05/index.qmd
    # - clases/clase_06/index.qmd
    # - clases/clase_07/index.qmd
    # - clases/clase_08/index.qmd
    # - clases/clase_09/index.qmd
    # - clases/clase_10/index.qmd
    # - clases/clase_11/index.qmd
    # - clases/clase_12/index.qmd

website:
  favicon: resources/imagenes/logo.svg
  title: "Métodos Cuantitativos"
  # site-url: https://udp-metodos-cuantitativos.netlify.app
  search: true
  page-navigation: true

  page-footer:
    left: |
      <div class="site-footer">
      <div class="footer-line"><i class="bi bi-c-circle"></i><span>Contenido © 2026 por <strong>Daniela Olivares</strong></span></div>
      <div class="footer-line"><i class="bi bi-cc-circle"></i><a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">Licencia Creative Commons Attribution-NonCommercial 4.0 (CC BY-NC 4.0)</a></div>
      <div class="footer-line"><i class="bi bi-person-badge"></i><span>Sitio creado por <strong>Katherine Aravena</strong></span></div>
      </div>
    center: ""
    right: |
      <div class="site-footer">
      <div class="footer-line"><i class="bi bi-braces"></i><span>Hecho con <a href="https://quarto.org" target="_blank" rel="noopener">Quarto</a></span></div>
      <div class="footer-line"><i class="bi bi-cc-circle"></i><a href="https://opensource.org/license/mit" target="_blank" rel="noopener">Código bajo licencia MIT</a></div>
      <div class="footer-line"><i class="bi bi-github"></i><a href="https://github.com/udp-metodos-cuantitativos/curso-2026" target="_blank" rel="noopener">Ver en GitHub</a></div>
      </div>

  navbar:
    title: false
    left:
      - text: "Inicio"
        href: index.qmd
      - text: "Clases"
        href: clases/clase_00/index.qmd
      - text: "Curso"
        href: curso.qmd
      - text: "Bibliografía"
        href: bibliografia.qmd
      - text: "Recursos"
        href: Recursos.qmd

    tools:
      - icon: github
        href: https://github.com/udp-metodos-cuantitativos/curso-2026
        aria-label: GitHub

format:
  html:
    md-extensions: +raw_html+fenced_divs+link_attributes
    theme: cosmo
    css:
      - styles.css
    link-external-newwindow: false
    anchor-sections: true
    smooth-scroll: false
    code-copy: true
    html-math-method: plain

freeze: auto

include-in-header:
  - text: |
      <!-- Google Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=block" rel="stylesheet">